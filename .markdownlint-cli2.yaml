---
# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2
config:
  default: true
  MD013: false  # line length: prose is wrapped by the editor, not by hand
  MD024:
    siblings_only: true
  MD033: false  # inline HTML (e.g. <details>) is allowed
  MD041: false  # first line need not be a heading (templates)
  MD060: false  # table column style: compact and aligned both allowed
globs:
  - "**/*.md"
gitignore: true
ignores:
  - CODE_OF_CONDUCT.md  # upstream Contributor Covenant text, verbatim
