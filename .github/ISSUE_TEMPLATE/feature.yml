---
name: Language feature request
description: Propose a change or addition to the plan language.
labels: ["enhancement", "spec"]
body:
  - type: markdown
    attributes:
      value: |
        Check ROADMAP.md first: many features (containers, `become`, services,
        locks, `race`, `matrix`) are already planned. Blokky aims to stay small:
        if a feature needs a general expression language, it probably doesn't belong.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you (or your agent) trying to express, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: shell
    attributes:
      label: Equivalent shell today
      description: The shell you would write without Blokky.
      render: shell
  - type: textarea
    id: proposal
    attributes:
      label: Proposed syntax
      description: A sketch of the plan you'd like to write.
      render: yaml
