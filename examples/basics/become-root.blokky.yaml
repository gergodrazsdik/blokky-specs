# Running a step as root
# `become` runs a node's leaves as another user through passwordless `sudo -n`
# or `doas -n`; Blokky never prompts for a password. Unix only, and an
# implementation may require you to opt in. Installs into /usr/local.
# Run: blokky run examples/basics/become-root.blokky.yaml
blokky: 1.0
do:
  - exec: [make]
  - name: install system-wide
    become: root
    exec: [make, install, PREFIX=/usr/local]
