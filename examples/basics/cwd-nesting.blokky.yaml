# Nesting cwd
# A relative `cwd` resolves against the parent's cwd, so paths are built by
# nesting instead of joining strings. Run in a .NET repository laid out as
# src/<Project> and tests/.
# Run: blokky run examples/basics/cwd-nesting.blokky.yaml --input PROJECT=Api
---
blokky: 1.0
inputs:
  PROJECT:
    default: Api
cwd: src
do:
  - name: build src/${PROJECT}
    cwd: {var: PROJECT}
    exec: [dotnet, build, -c, Release]
  - name: test from tests/
    cwd: ../tests
    exec: [dotnet, test]
