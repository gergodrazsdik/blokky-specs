# Working in a temp dir
# `tempdir` creates a fresh private directory and makes it the node's cwd;
# `as` binds its path. `remove: on_success` deletes it at the end unless the
# node failed, so a failure can be inspected. Tests the GitHub CLI from a clean
# shallow clone. Needs git, Go and network access.
# Run: blokky run examples/basics/tempdir.blokky.yaml
blokky: 1.0
name: test gh in a clean clone
tempdir: { as: WORK, prefix: gh-test, remove: on_success }
timeout: 15m
do:
  - exec: [git, clone, --depth, '1', https://github.com/cli/cli.git, .]
  - log: "Testing in ${WORK}"
  - exec: [go, test, ./...]
