# Environment, export and secrets
# `env` sets environment variables for a scope: literals, `{from_env: ...}`
# or `{var: ...}`, marked `secret: true` to mask them. `export` passes plan
# variables to processes under the same name. Needs GITHUB_TOKEN set.
# Run: blokky run examples/basics/env-export-secrets.blokky.yaml --input REPO=cli/cli
---
blokky: 1.0
inputs:
  REPO:
    description: Repository as owner/name
    matches: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
env:
  GH_TOKEN: {from_env: GITHUB_TOKEN, secret: true}
  GH_PROMPT_DISABLED: '1'
export: [REPO]
script: |
  gh api "repos/$REPO/releases/latest" --jq .tag_name
shell: bash
