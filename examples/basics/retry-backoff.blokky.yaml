# retry with backoff
# `retry: true` retries failed attempts up to `max` times in total. `every`
# is the first delay, `backoff` grows it (2s, 4s, 8s, 16s, capped at 30s) and
# `jitter` spreads retries out. Pushes an image you have built and tagged.
# Run: blokky run examples/basics/retry-backoff.blokky.yaml --input IMAGE=ghcr.io/example/web:1.4.0
blokky: 1.0
inputs:
  IMAGE:
    description: Image reference to push
name: push ${IMAGE}
exec: [docker, push, { var: IMAGE }]
retry: true
max: 5
every: 2s
backoff: { factor: 2, max: 30s }
jitter: 0.2
timeout: 10m
