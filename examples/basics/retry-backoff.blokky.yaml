# retry with backoff
# `retry: true` retries failed attempts; `max` counts attempts, the first
# included, so `max: 5` is one try and up to four retries. `every` is the first
# delay, `backoff` grows it (2s, 4s, 8s, 16s, capped at 30s) and `jitter`
# spreads retries out. `index` numbers the attempts. Pushes an image you have
# built and tagged.
# Run: blokky run examples/basics/retry-backoff.blokky.yaml --input IMAGE=ghcr.io/example/web:1.4.0
blokky: 1.0
inputs:
  IMAGE:
    description: Image reference to push
name: push ${IMAGE}
retry: true
index: { as: ATTEMPT, start: 1 }
max: 5
every: 2s
backoff: { factor: 2, max: 30s }
jitter: 0.2
timeout: 10m
do:
  - log: "push attempt ${ATTEMPT} of 5"
  - exec: [docker, push, { var: IMAGE }]
