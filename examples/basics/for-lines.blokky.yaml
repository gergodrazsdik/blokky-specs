# for lines
# `for: { lines }` runs the body once per line of a variable; blank lines are
# dropped unless `keep_blank: true`. Deletes local branches already merged into
# main (git branch -d refuses unmerged ones), then shows the latest release's
# notes with their paragraph breaks. Run inside a GitHub clone with gh.
# Run: blokky run examples/basics/for-lines.blokky.yaml
blokky: 1.0
do:
  - exec: [git, branch, --merged, main, '--format=%(refname:short)']
    capture: MERGED
  - name: delete ${BRANCH}
    for: { lines: { var: MERGED }, as: BRANCH }
    do:
      - when: { var: BRANCH, not_equals: main }
        exec: [git, branch, -d, { var: BRANCH }]
  - exec: [gh, release, view, --json, body, --jq, .body]
    capture: NOTES
  - for: { lines: { var: NOTES }, as: LINE, keep_blank: true }
    log: "${LINE}"
