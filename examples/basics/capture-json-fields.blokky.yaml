# Capturing JSON fields
# `capture: { NAME: .path }` parses stdout as JSON and binds one variable per
# field. A path that doesn't resolve fails the node. Needs the GitHub CLI,
# run inside a GitHub clone.
# Run: blokky run examples/basics/capture-json-fields.blokky.yaml
blokky: 1.0
do:
  - exec: [gh, repo, view, --json, 'nameWithOwner,defaultBranchRef,stargazerCount']
    capture:
      REPO: .nameWithOwner
      DEFAULT_BRANCH: .defaultBranchRef.name
      STARS: .stargazerCount
  - log: "${REPO}: default branch ${DEFAULT_BRANCH}, ${STARS} stars"
