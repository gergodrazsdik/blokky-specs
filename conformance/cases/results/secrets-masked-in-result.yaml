title: A secret value appears nowhere in the run result; outputs are marked secret without a value
rules: [RS-2]
features: [outputs, do, set, from-env, secret-ref, log, interpolation, exec, fail]
env:
  CASE_DEPLOY_TOKEN: abcdefghijkl
plan: |
  blokky: 1.0
  outputs: [TOKEN]
  do:
    - set: { TOKEN: { from_env: CASE_DEPLOY_TOKEN, secret: true } }
    - log: "using ${TOKEN}"
    - exec: [blokky-testkit, print, --out, { var: TOKEN }]
    - fail: "rejected ${TOKEN}"
expect:
  status: failed
  error: { code: BK_FAIL, node: /do/3 }
  outputs:
    TOKEN: { $secret: true }
  nodes:
    /do/1:
      messages: [{ text: using *** }]
    /do/2:
      invocation: { $contains: ['***'] }
    /do/3:
      messages: [{ text: rejected *** }]
  invocations:
    - { argv: [print, --out, abcdefghijkl] }
notes: >-
  The value has 12 characters, above the masking threshold (VA-51). The
  invocation log is the testkit's own record, not the run result, so it holds
  the real argument; the leaf's invocation in the result is masked.
