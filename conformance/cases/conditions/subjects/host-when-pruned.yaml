title: A node whose host condition is false is pruned before the shell check, and is skipped with skip_reason pruned
rules: [CO-7]
spec: [shells.md§5]
features: [do, when, script, shell-powershell, log, cond-host]
clock: [real]
plan: |
  blokky: 1.0
  do:
    - when: { host: os, equals: windows }
      shell: powershell
      script: |
        Write-Output 'windows only'
    - log: after
expect:
  status: succeeded
  error: null
  nodes:
    /do/0: { status: skipped, skip_reason: pruned }
    /do/1: { status: succeeded }
platforms:
  windows:
    requires: { shells: [powershell] }
    expect:
      nodes:
        /do/0: { status: succeeded, skip_reason: { $absent: true } }
notes: >-
  On Linux and macOS, powershell isn't a supported shell (BK_SHELL_UNAVAILABLE,
  SH-23), so the run succeeds only because the branch is pruned first.
