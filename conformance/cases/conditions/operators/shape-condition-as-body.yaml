title: A condition where a node list is expected is one targeted value error at the value
rules: [CO-4, SY-91]
features: [vars, if, cond-var]
plan: |
  blokky: 1.0
  vars:
    MODE: fast
  if: { var: MODE, equals: fast }
  then: { var: MODE, equals: slow }
expect:
  plan_errors:
    - code: BK_PLAN_VALUE
      detail: { rule: CO-4 }
      line: 5
      column: 7
  exhaustive: true
notes: >-
  CO-4 names the mistake. SY-91's targeted error for a mapping where a body
  list is expected changes the message, not the rule, so it is reported as
  CO-4 (SY-3, ADR 0025).
