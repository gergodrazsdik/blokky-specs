title: A probe that can't start in when fails the node instead of skipping it
rules: [CO-38, CO-41]
features: [do, when, exec, cond-probe]
clock: [real]
plan: |
  blokky: 1.0
  do:
    - when: { probe: { exec: [conf-no-such-program] } }
      exec: [blokky-testkit, print, --out, body]
    - exec: [blokky-testkit, print, --out, next]
expect:
  status: failed
  error:
    code: BK_CONDITION_ERROR
    node: /do/0
    detail: { reason: probe_spawn }
  nodes:
    /do/0: { status: failed }
    /do/1: { status: skipped, skip_reason: not_reached }
  invocations: []
