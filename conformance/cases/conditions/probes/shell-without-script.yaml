title: A probe's shell without script is a plan error
rules: [CO-26]
features: [if, exec, cond-probe]
plan: |
  blokky: 1.0
  if:
    probe:
      exec: [blokky-testkit, exit, '0']
      shell: bash
  then:
    - exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: CO-26 }
      line: 5
      column: 5
  exhaustive: true
