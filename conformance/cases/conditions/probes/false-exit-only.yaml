title: With only false_exit, the listed codes are false and every other code is true
rules: [CO-33]
features: [do, if, exec, cond-probe]
clock: [real]
plan: |
  blokky: 1.0
  do:
    - if: { probe: { exec: [blokky-testkit, exit, '0'], false_exit: [0] } }
      then:
        - exec: [blokky-testkit, print, --out, zero-true]
      else:
        - exec: [blokky-testkit, print, --out, zero-false]
    - if: { probe: { exec: [blokky-testkit, exit, '5'], false_exit: [0] } }
      then:
        - exec: [blokky-testkit, print, --out, five-true]
expect:
  status: succeeded
  error: null
  nodes:
    /do/0/then/0: { status: skipped, skip_reason: not_taken }
    /do/0/else/0: { status: succeeded }
    /do/1/then/0: { status: succeeded }
  invocations:
    - { argv: [exit, '0'] }
    - { argv: [print, --out, zero-false] }
    - { argv: [exit, '5'] }
    - { argv: [print, --out, five-true] }
