title: A bare probe that exits 0 is true, and the probe is recorded on the node
rules: [CO-2, CO-31, CO-33]
features: [if, exec, cond-probe]
clock: [real]
plan: |
  blokky: 1.0
  if: { probe: { exec: [blokky-testkit, exit, '0'] } }
  then:
    - exec: [blokky-testkit, print, --out, then]
  else:
    - exec: [blokky-testkit, print, --out, else]
expect:
  status: succeeded
  error: null
  nodes:
    /:
      status: succeeded
      probes:
        - { invocation: [blokky-testkit, exit, '0'], exit_code: 0, result: true }
    /then/0: { status: succeeded }
    /else/0: { status: skipped, skip_reason: not_taken }
  invocations:
    - { argv: [exit, '0'] }
    - { argv: [print, --out, then] }
