title: A while probe runs before each iteration, including the check that ends the loop
rules: [CO-36]
spec: [conditions.md§6, reference.md§5.6]
features: [while, exec, cond-probe, cond-numeric]
clock: [real]
plan: |
  blokky: 1.0
  while: { probe: { exec: [blokky-testkit, count, --state, checks.txt] }, le: '2' }
  max: 5
  every: 0s
  exec: [blokky-testkit, print, --out, body]
expect:
  status: succeeded
  error: null
  nodes:
    /:
      status: succeeded
      repetition: { count: 2, ended_by: condition, last_condition: false }
  invocations:
    - { argv: [count, --state, checks.txt] }
    - { argv: [print, --out, body] }
    - { argv: [count, --state, checks.txt] }
    - { argv: [print, --out, body] }
    - { argv: [count, --state, checks.txt] }
