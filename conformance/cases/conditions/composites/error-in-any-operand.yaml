title: A condition error in an evaluated operand of any is not treated as false
rules: [CO-24]
spec: [conditions.md§7]
features: [vars, if, exec, cond-composite, cond-var, cond-numeric]
plan: |
  blokky: 1.0
  vars:
    MODE: release
    COUNT: many
  if:
    any:
      - { var: MODE, equals: debug }
      - { var: COUNT, gt: '1' }
  then:
    - exec: [blokky-testkit, print, --out, then]
  else:
    - exec: [blokky-testkit, print, --out, else]
expect:
  status: failed
  error:
    code: BK_CONDITION_ERROR
    node: /
    detail: { reason: not_a_number }
  nodes:
    /: { status: failed }
  invocations: []
notes: >-
  Were the error counted as false, the any would be false and else would run.
