title: A glob skips dotfiles unless the pattern names them with a leading dot; ?, * and classes never match it
rules: [SY-71, SY-100]
features: [do, for-glob, exec]
files:
  d/visible.md: visible
  d/.hidden.md: hidden
plan: |
  blokky: 1.0
  do:
    - for: { glob: 'd/*.md', as: FILE }
      exec: [blokky-testkit, exit, '0']
    - for: { glob: 'd/.*.md', as: FILE }
      exec: [blokky-testkit, exit, '0']
    - for: { glob: 'd/?hidden.md', as: FILE, allow_empty: true }
      exec: [blokky-testkit, exit, '0']
    - for: { glob: 'd/[.]hidden.md', as: FILE, allow_empty: true }
      exec: [blokky-testkit, exit, '0']
expect:
  status: succeeded
  nodes:
    /do/0:
      repetition:
        count: 1
        entries:
          - { item: { $regex: '(^|/)d/visible\.md$' } }
    /do/1:
      repetition:
        count: 1
        entries:
          - { item: { $regex: '(^|/)d/\.hidden\.md$' } }
    /do/2:
      repetition: { count: 0 }
    /do/3:
      repetition: { count: 0 }
notes: >-
  *, ? and a class don't match an entry whose name starts with a dot unless
  the pattern segment starts with a dot, as .*.md does (SY-100, ADR 0025):
  ?hidden.md and [.]hidden.md match nothing.
