title: A backslash escape like \d in a double-quoted regex is a YAML error (pitfall)
rules: [SY-89]
features: [vars, assert, cond-var]
plan: |
  blokky: 1.0
  vars:
    COUNT: '42'
  assert: { var: COUNT, matches: "^\d+$" }
expect:
  plan_errors:
    - code: BK_PLAN_YAML
      line: 4
  exhaustive: true
notes: The column isn't asserted; SY-89 doesn't say whether it points at the scalar or the escape.
