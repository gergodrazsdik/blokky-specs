title: An empty key (a line starting with ':') is a complex key and a YAML error
rules: [SY-17]
features: [log]
plan: |
  blokky: 1.0
  log: hello
  : greeting
expect:
  plan_errors:
    - code: BK_PLAN_YAML
      line: 3
      column: 1
  exhaustive: true
notes: >-
  YAML 1.2 reads ': greeting' as a mapping entry with an empty (null) key.
  A key must be a plain or quoted string, so it is rejected like a '?' key
  (syntax/yaml/complex-key-rejected).
