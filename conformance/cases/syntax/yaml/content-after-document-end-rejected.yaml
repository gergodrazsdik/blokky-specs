title: Content after a ... document end marker is a YAML error
rules: [SY-16]
features: [log]
plan: |
  blokky: 1.0
  log: hello
  ...
  log: again
expect:
  plan_errors:
    - code: BK_PLAN_YAML
      line: 4      # the content after ... (SY-1)
      column: 1
  exhaustive: true
notes: >-
  The error is located at the content after the ..., not at the ... itself
  (SY-1, ADR 0025).
