title: In a boolean field, True, yes, on and 1 are errors at the value
rules: [SY-3, SY-24]
features: [do, exec, ignore-errors]
plan: |
  blokky: 1.0
  do:
    - ignore_errors: True
      exec: [blokky-testkit, exit, '0']
    - ignore_errors: yes
      exec: [blokky-testkit, exit, '0']
    - ignore_errors: on
      exec: [blokky-testkit, exit, '0']
    - ignore_errors: 1
      exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - { code: BK_PLAN_VALUE, line: 3, column: 20 }
    - { code: BK_PLAN_VALUE, line: 5, column: 20 }
    - { code: BK_PLAN_VALUE, line: 7, column: 20 }
    - { code: BK_PLAN_VALUE, line: 9, column: 20 }
  exhaustive: true
