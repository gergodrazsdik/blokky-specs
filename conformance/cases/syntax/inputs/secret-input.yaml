title: An input can't be secret
rules: [SY-48]
features: [inputs, log]
plan: |
  blokky: 1.0
  inputs:
    TOKEN:
      description: API token
      secret: true
  log: calling
inputs: [TOKEN=abcdefgh]
expect:
  plan_errors:
    - code: BK_PLAN_UNKNOWN_KEY   # SY-48: the targeted error keeps the unknown-key code (ADR 0025)
      detail: { rule: { $absent: true } }
      line: 5
      column: 5
  exhaustive: true
