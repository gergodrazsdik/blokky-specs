title: An input can't be secret
rules: [SY-48]
features: [inputs, log]
plan: |
  blokky: 1.0
  inputs:
    TOKEN:
      description: API token
      secret: true
  log: calling
inputs: [TOKEN=abcdefgh]
expect:
  plan_errors:
    - code: BK_PLAN_UNKNOWN_KEY   # secret isn't a key of an input (SY-40)
      line: 5
      column: 5
