title: An input has no type key
rules: [SY-43]
features: [inputs, log]
plan: |
  blokky: 1.0
  inputs:
    COUNT:
      type: string
      default: '3'
  log: counting
expect:
  plan_errors:
    - code: BK_PLAN_UNKNOWN_KEY
      detail: { suggestion: { $absent: true } }   # no synonym, no key within edit distance 2 (SY-30)
      line: 4
      column: 5
  exhaustive: true
