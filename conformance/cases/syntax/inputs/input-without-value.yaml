title: An input name with no value is an empty value, not an input without keys
rules: [SY-41]
features: [inputs, log]
plan: |
  blokky: 1.0
  inputs:
    BRANCH:
  log: building
inputs: [BRANCH=main]
expect:
  plan_errors:
    - code: BK_PLAN_VALUE   # "an empty value" (errors.md §4)
      detail: { rule: SY-20 }
      line: 3      # a missing value is located at its key (SY-1)
      column: 3
  exhaustive: true
notes: SY-41 says `NAME:` with no value is an empty value, reported as SY-20 (SY-3).
