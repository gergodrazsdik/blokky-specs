title: An input has at most one constraint, in or matches
rules: [SY-45, RF-20]
features: [inputs, log]
plan: |
  blokky: 1.0
  inputs:
    ENVIRONMENT:
      default: staging
      in: [staging, production]
      matches: '^[a-z]+$'
  log: deploying
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-20 }
      line: 6      # two conflicting keys: the later one (SY-1)
      column: 5
  exhaustive: true
notes: detail.rule is RF-20, the reference.md §8 rule that SY-45 restates (errors.md §4).
