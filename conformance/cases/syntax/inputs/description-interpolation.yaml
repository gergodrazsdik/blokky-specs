title: An input description must not contain an interpolation
rules: [SY-49]
features: [inputs, log]
plan: |
  blokky: 1.0
  inputs:
    ENVIRONMENT:
      default: staging
    BRANCH:
      description: Branch to deploy to ${ENVIRONMENT}
  log: deploying
inputs: [BRANCH=main]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: SY-49 }
      line: 6
      column: 18
  exhaustive: true
