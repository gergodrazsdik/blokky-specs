title: A synonym is suggested even when a valid key is within edit distance 2
rules: [SY-30]
features: [do, exec]
plan: |
  blokky: 1.0
  do:
    - exit: done
      exec: [blokky-testkit, exit, '0']
    - loop: [a, b]
      exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - code: BK_PLAN_UNKNOWN_KEY
      detail: { suggestion: { $regex: '^return' } }   # not exec (distance 2)
      line: 3
      column: 5
    - code: BK_PLAN_UNKNOWN_KEY
      detail: { suggestion: { $regex: '^for' } }      # not log (distance 2)
      line: 5
      column: 5
  exhaustive: true
notes: >-
  The synonym table gives return and a for: snippet; only their start is matched,
  because SY-30 doesn't fix how a multi-part suggestion is written.
