title: Bidirectional controls in comments and in values are each reported
rules: [SY-1, SY-3, SY-10, SY-12, SY-13]
features: [log]
plan_base64: Ymxva2t5OiAxLjAKIyDigK5hZG1pbiBvbmx5Cm5hbWU6ICdh4oGmYicKbG9nOiAnw6nigI9iJwojIHjYnAo=
expect:
  plan_errors:
    - code: BK_PLAN_CHARACTER
      detail: { codepoint: U+202E }
      line: 2
      column: 3   # RIGHT-TO-LEFT OVERRIDE, in a comment
    - code: BK_PLAN_CHARACTER
      detail: { codepoint: U+2066 }
      line: 3
      column: 9   # LEFT-TO-RIGHT ISOLATE
    - code: BK_PLAN_CHARACTER
      detail: { codepoint: U+200F }
      line: 4
      column: 8   # RIGHT-TO-LEFT MARK, after a two-byte e-acute: columns count code points
    - code: BK_PLAN_CHARACTER
      detail: { codepoint: U+061C }
      line: 5
      column: 4   # ARABIC LETTER MARK, in a comment
  exhaustive: true
notes: Character-lint errors end processing before YAML parsing (SY-10), so no other error follows.
