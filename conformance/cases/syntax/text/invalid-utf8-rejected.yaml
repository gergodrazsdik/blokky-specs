title: A byte that isn't valid UTF-8 is one encoding error at its offset, line and column
rules: [SY-7]
features: [log]
plan_base64: Ymxva2t5OiAxLjAKbG9nOiBhYmP/Cg==
expect:
  plan_errors:
    - code: BK_PLAN_ENCODING
      detail: { offset: 20 }
      line: 2
      column: 9   # 0xFF after 'log: abc'
  exhaustive: true
