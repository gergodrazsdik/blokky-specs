title: A plan encoded as UTF-16LE with a byte-order mark is one encoding error
rules: [SY-1, SY-5, SY-6]
features: [log]
plan_base64: //5iAGwAbwBrAGsAeQA6ACAAMQAuADAACgBsAG8AZwA6ACAAaABlAGwAbABvAAoA
expect:
  plan_errors:
    - code: BK_PLAN_ENCODING
      line: 1
      column: 1   # a whole-text error (SY-1)
  exhaustive: true
