title: retry with a number is a value error at the value
rules: [SY-88, SY-91]
features: [exec, retry]
plan: |
  blokky: 1.0
  retry: 3
  exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - code: BK_PLAN_VALUE
      detail: { rule: SY-88 }
      line: 2
      column: 8
  exhaustive: true
notes: >-
  retry's scalar form is the boolean true. The targeted error changes the
  message, not the rule: it reports the generic type rule (SY-88, errors.md §4; SY-3, SY-91,
  ADR 0025).
