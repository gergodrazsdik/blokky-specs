title: A single node instead of a body list is a value error at the value
rules: [SY-88, SY-91]
features: [do]
plan: |
  blokky: 1.0
  do: { exec: [blokky-testkit, exit, '0'] }
expect:
  plan_errors:
    - code: BK_PLAN_VALUE
      detail: { rule: SY-88 }
      line: 2
      column: 5
  exhaustive: true
notes: >-
  The targeted error replaces the generic type error and reports its rule: do
  is a list of nodes (SY-88; SY-3, SY-91, ADR 0025). The fix-it is in the message.
