title: A mapping as the value of exec is one targeted value error at the value
rules: [SY-3, SY-88, SY-91]
features: [do]
plan: |
  blokky: 1.0
  do:
    - exec: { cmd: blokky-testkit exit 0, timeout: 5m }
expect:
  plan_errors:
    - code: BK_PLAN_VALUE
      detail: { rule: SY-88 }
      line: 3
      column: 11
  exhaustive: true
notes: >-
  The targeted error replaces the generic type and unknown-key errors and
  reports the generic rule: exec is a list of strings or a string (SY-88; SY-3,
  SY-91, ADR 0025).
