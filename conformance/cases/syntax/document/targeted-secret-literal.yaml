title: A literal marked secret is one targeted error
rules: [SY-3, SY-91, RF-19]
features: [env, exec]
plan: |
  blokky: 1.0
  env: { T: { value: abc, secret: true } }
  exec: [blokky-testkit, env, T]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-19 }
      line: 2
      column: 25   # the secret key (SY-1)
  exhaustive: true
notes: >-
  The targeted error replaces the generic unknown-key error for value. A secret
  literal is located at its secret key (SY-1, ADR 0025).
