title: A literal marked secret is one targeted error
rules: [SY-3, SY-91, RF-19]
features: [env, exec]
plan: |
  blokky: 1.0
  env: { T: { value: abc, secret: true } }
  exec: [blokky-testkit, env, T]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-19 }
      line: 2
  exhaustive: true
notes: >-
  The targeted error replaces the generic unknown-key error for value. The column
  isn't asserted: the spec doesn't say whether it points at value or secret.
