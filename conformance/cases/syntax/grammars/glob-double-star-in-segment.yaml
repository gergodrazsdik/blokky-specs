title: '** inside a glob segment is a plan error'
rules: [SY-72]
features: [do, for-glob, exec]
plan: |
  blokky: 1.0
  do:
    - for: { glob: 'src/a**b/x.md', as: FILE }
      exec: [blokky-testkit, exit, '0']
    - for: { glob: 'docs/**.md', as: FILE }
      exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - { code: BK_PLAN_VALUE, detail: { rule: SY-72 }, line: 3, column: 18 }
    - { code: BK_PLAN_VALUE, detail: { rule: SY-72 }, line: 5, column: 18 }
  exhaustive: true
