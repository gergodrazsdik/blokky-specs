title: JSON paths start with a dot, use .name only for identifier keys, double-quote bracket keys and write indices without leading zeros
rules: [SY-64, SY-65, SY-66, SY-67]
features: [exec, capture-fields]
plan: |
  blokky: 1.0
  exec: [blokky-testkit, print, --out, '{"a-b":1,"c":[1]}']
  capture:
    NO_DOT: c
    DASHED: .a-b
    SINGLE: ".['a-b']"
    BARE_BRACKET: '["a-b"]'
    NOT_INDEX: '.c[x]'
    ZERO_LED: '.c[01]'
expect:
  plan_errors:
    - { code: BK_PLAN_VALUE, detail: { rule: SY-65 }, line: 4, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SY-65 }, line: 5, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SY-66 }, line: 6, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SY-66 }, line: 7, column: 17 }
    - { code: BK_PLAN_VALUE, detail: { rule: SY-67 }, line: 8, column: 14 }
    - { code: BK_PLAN_VALUE, detail: { rule: SY-67 }, line: 9, column: 13 }
  exhaustive: true
notes: >-
  c lacks the leading dot (SY-64, SY-65); a-b isn't an identifier, so it
  needs .["a-b"] (SY-65, SY-66); bracket keys are double-quoted (SY-66) and
  a bracket path starts with a dot (SY-66); an index is decimal, without
  leading zeros (SY-67).
