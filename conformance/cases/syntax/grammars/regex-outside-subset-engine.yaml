title: Lookaround, backreferences, atomic groups and possessive quantifiers are outside the regex subset
rules: [SY-61, SY-62, RF-22]
features: [vars, do, when, cond-var, exec]
plan: |
  blokky: 1.0
  vars:
    X: aab
  do:
    - when: { var: X, matches: 'a(?=b)' }
      exec: [blokky-testkit, exit, '0']
    - when: { var: X, matches: '(?<!b)a' }
      exec: [blokky-testkit, exit, '0']
    - when: { var: X, matches: '(a)\1' }
      exec: [blokky-testkit, exit, '0']
    - when: { var: X, matches: '(?>a+)b' }
      exec: [blokky-testkit, exit, '0']
    - when: { var: X, matches: 'a++b' }
      exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - { code: BK_PLAN_INVALID, detail: { rule: RF-22 }, line: 5 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-22 }, line: 7 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-22 }, line: 9 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-22 }, line: 11 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-22 }, line: 13 }
  exhaustive: true
notes: >-
  detail.rule is RF-22, the reference.md §8 rule for the subset. Columns are
  left out: whether a quoted scalar's position is its quote or its first
  character isn't fixed.
