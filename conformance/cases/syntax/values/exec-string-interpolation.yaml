title: ${X} in an exec string (non-canonical string form) is a plan error, because executed text is literal
rules: [SY-76, RF-27]
features: [vars, exec, exec-string]
plan: |
  blokky: 1.0
  vars:
    NAME: world
  exec: blokky-testkit argv ${NAME}
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-27 }
      line: 4
  exhaustive: true
notes: >-
  detail.rule is RF-27 (templates appear only in set and vars values). The
  column is left out: SY-1 doesn't say whether it is the value's start or the
  placeholder's.
