title: ${X} in an exec string (non-canonical string form) is a plan error, because executed text is literal
rules: [SY-76, RF-9]
features: [vars, exec-string]
plan: |
  blokky: 1.0
  vars:
    NAME: world
  exec: blokky-testkit argv ${NAME}
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-9 }
      line: 4
      column: 7    # an error inside a string is at the value's start (SY-1)
  exhaustive: true
notes: RF-9 wins over RF-27 for `${…}` in a literal field (errors.md §4).
