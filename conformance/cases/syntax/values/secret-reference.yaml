title: A var reference marked secret makes a secret variable, masked in rendered text
rules: [SY-78, SY-87]
features: [vars, outputs, do, set, secret-ref, log, interpolation]
plan: |
  blokky: 1.0
  vars:
    PLAIN: abcdefgh
  outputs: [MARKED]
  do:
    - set: { MARKED: { var: PLAIN, secret: true } }
    - log: 'token ${MARKED}'
expect:
  status: succeeded
  outputs:
    MARKED: { $secret: true }
  nodes:
    /do/1:
      messages:
        - { text: token *** }
notes: >-
  The value has 8 characters, above the 6-character masking threshold
  (VA-51). PLAIN isn't an output: whether a non-secret variable with
  the same value is masked is open (spec gap).
