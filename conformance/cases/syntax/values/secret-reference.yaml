title: A var reference marked secret makes a secret variable, masked in rendered text and wherever its value appears
rules: [SY-78, SY-87, VA-47, VA-51]
features: [vars, outputs, do, set, secret-ref, log, interpolation]
plan: |
  blokky: 1.0
  vars:
    PLAIN: abcdefgh
  outputs: [MARKED, PLAIN]
  do:
    - set: { MARKED: { var: PLAIN, secret: true } }
    - log: 'token ${MARKED}'
expect:
  status: succeeded
  outputs:
    MARKED: { $secret: true }
    PLAIN: '***'   # not secret, but its value is a secret value (VA-47)
  nodes:
    /do/1:
      messages:
        - { text: token *** }
notes: >-
  The value has 8 characters, above the 6-character masking threshold
  (VA-51). PLAIN itself isn't secret, but masking follows the value, so its
  output is masked too.
