title: $${ produces a literal ${ in display strings, templates and literal fields
rules: [SY-84]
features: [vars, outputs, do, set, log, interpolation, exec]
plan: |
  blokky: 1.0
  vars:
    TARGET: world
  outputs: [LITERAL]
  do:
    - set: { LITERAL: '$${HOME} and ${TARGET}' }
    - log: 'cost $${TARGET} for ${TARGET}'
    - exec: [blokky-testkit, argv, '$${TARGET}']
expect:
  status: succeeded
  outputs:
    LITERAL: '${HOME} and world'
  nodes:
    /do/1:
      messages:
        - { text: 'cost ${TARGET} for world' }
  invocations:
    - { argv: [argv, '${TARGET}'] }
notes: >-
  $${HOME} names no plan variable; escaped, it is no reference, so the scope
  check doesn't reject it. In the literal exec element, $${ is ${ and never
  the "${ in a literal field" error (SY-84).
