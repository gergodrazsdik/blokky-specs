title: for items from a secret variable are secret and recorded masked
rules: [VA-50]
features: [do, set, from-env, secret-ref, for-items, exec]
plan: |
  blokky: 1.0
  do:
    - set: { TOKS: { from_env: CONF_TOKS, secret: true } }
    - for: { items: { var: TOKS }, as: T }
      exec: [blokky-testkit, argv, { var: T }]
env:
  CONF_TOKS: '["alpha-one","beta-two"]'
expect:
  status: succeeded
  nodes:
    /do/1:
      repetition:
        count: 2
        entries:
          - { index: 0, item: '***' }
          - { index: 1, item: '***' }
  invocations:
    - { argv: [argv, alpha-one] }
    - { argv: [argv, beta-two] }
notes: Both items have at least 6 characters, so they are masked (VA-51).
