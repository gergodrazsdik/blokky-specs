title: The value of a secret capture is masked in other captures and in rendered messages
rules: [VA-27, VA-51]
features: [outputs, do, exec, capture, secret, log, interpolation]
plan: |
  blokky: 1.0
  outputs: [COPY]
  do:
    - exec: [blokky-testkit, print, --out, captured-secret]
      secret: true
      capture: S
    - exec: [blokky-testkit, print, --out, { var: S }]
      capture: COPY
    - log: 'got ${S}'
expect:
  status: succeeded
  outputs:
    COPY: '***'
  nodes:
    /do/2:
      messages:
        - { text: got *** }
