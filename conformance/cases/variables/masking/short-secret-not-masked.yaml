title: Secrets of at least 6 characters are masked; shorter ones aren't
rules: [VA-47, VA-51, VA-52]
features: [outputs, do, set, from-env, secret-ref, exec, capture]
plan: |
  blokky: 1.0
  outputs: [S5, SHORT, SIX]
  do:
    - set:
        S5: { from_env: CONF_S5, secret: true }
        S6: { from_env: CONF_S6, secret: true }
    - exec: [blokky-testkit, print, --newline, none, --out, x-, --out, { var: S5 }]
      capture: SHORT
    - exec: [blokky-testkit, print, --newline, none, --out, x-, --out, { var: S6 }]
      capture: SIX
env:
  CONF_S5: abc12
  CONF_S6: abc123
expect:
  status: succeeded
  outputs:
    S5: { $secret: true }
    SHORT: x-abc12
    SIX: x-***
notes: >-
  The 5-character secret shows in plain text; the implementation warns about
  it (VA-52), which a case can't assert (ADR 0021 B-4). A short secret output
  is still marked secret without a value (VA-47).
