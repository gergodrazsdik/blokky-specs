title: A collect list of a secret capture is a secret output
rules: [VA-50, VA-55]
features: [outputs, for-each, collect, exec, capture, secret]
plan: |
  blokky: 1.0
  outputs: [VS]
  for: { each: [first-value, second-value], as: ITEM }
  collect: { V: VS }
  exec: [blokky-testkit, print, --out, { var: ITEM }]
  capture: V
  secret: true
expect:
  status: succeeded
  outputs:
    VS: { $secret: true }
