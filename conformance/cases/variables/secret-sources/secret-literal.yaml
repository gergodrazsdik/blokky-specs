title: A literal marked secret is a plan error under RF-19, not an unknown key
rules: [VA-49, RF-19, SY-78]
features: [exec, env]
plan: |
  blokky: 1.0
  exec: [blokky-testkit, getenv, T]
  env: { T: { value: abc123, secret: true } }
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-19 }
      line: 3
  exhaustive: true
notes: >-
  RF-19 says the error is reported under it, not as an unknown key, and a
  targeted error (SY-91) replaces the generic one (SY-3). The column isn't
  asserted: the spec doesn't say whether the mapping or its secret key is located.
