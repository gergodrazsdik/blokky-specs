title: A secret reference, and a template using it, are secret outputs without a value
rules: [VA-47, VA-49, VA-59]
features: [set, outputs, from-env, secret-ref, interpolation]
clock: [real, scaled, virtual]
plan: |
  blokky: 1.0
  outputs: [TOKEN, HEADER, PLAIN]
  set:
    TOKEN: { from_env: CONF_TOKEN, secret: true }
    HEADER: 'Bearer ${TOKEN}'
    PLAIN: visible
env:
  CONF_TOKEN: s3cr3t-value
expect:
  status: succeeded
  outputs:
    TOKEN: { $secret: true }
    HEADER: { $secret: true }
    PLAIN: visible
