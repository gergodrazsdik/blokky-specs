title: A capture of a node with secret true is a secret output
rules: [VA-27, VA-47, VA-49]
features: [outputs, exec, capture, secret]
plan: |
  blokky: 1.0
  outputs: [S]
  exec: [blokky-testkit, print, --out, s3cr3t-value]
  capture: S
  secret: true
expect:
  status: succeeded
  outputs:
    S: { $secret: true }
