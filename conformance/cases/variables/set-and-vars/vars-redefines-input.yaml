title: A vars entry can't reuse an input's name
rules: [VA-9, VA-36, RF-26]
features: [inputs, vars, log]
plan: |
  blokky: 1.0
  inputs:
    BRANCH:
      default: main
  vars:
    BRANCH: dev
  log: done
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-26 }
      line: 6
      column: 3
