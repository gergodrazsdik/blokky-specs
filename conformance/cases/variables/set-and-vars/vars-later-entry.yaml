title: A vars value can't use a later vars entry
rules: [VA-61, RF-27]
features: [vars, log, interpolation]
plan: |
  blokky: 1.0
  vars:
    A: '${B}-x'
    B: base
  log: done
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-27 }
      line: 3
      column: 6
  exhaustive: true   # RF-6, RF-16 and RF-27 win over RF-23 (ADR 0025)
