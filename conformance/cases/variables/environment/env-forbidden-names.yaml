title: env can't set BASH_ENV, ENV, SHELLOPTS or BASHOPTS
rules: [VA-41, RF-10]
features: [env, exec]
plan: |
  blokky: 1.0
  env:
    BASH_ENV: /conf/a
    ENV: /conf/b
    SHELLOPTS: xtrace
    BASHOPTS: extglob
  exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - { code: BK_PLAN_INVALID, detail: { rule: RF-10 }, line: 3, column: 3 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-10 }, line: 4, column: 3 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-10 }, line: 5, column: 3 }
    - { code: BK_PLAN_INVALID, detail: { rule: RF-10 }, line: 6, column: 3 }
  exhaustive: true
notes: Each key is one mistake and one error (errors.md §4); PATH is in reference/rules/env-forbidden-key.
