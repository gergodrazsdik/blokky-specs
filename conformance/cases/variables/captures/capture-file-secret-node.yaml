title: On a secret node the capture is secret, but the capture_file path isn't, and the file isn't masked
rules: [VA-27]
features: [outputs, do, exec, capture, capture-file, secret, assert, cond-var]
plan: |
  blokky: 1.0
  outputs: [SECRET, FILE]
  do:
    - exec: [blokky-testkit, print, --out, s3cr3t-value]
      secret: true
      capture: SECRET
      capture_file: FILE
    - exec: [blokky-testkit, read-file, { var: FILE }]
      capture: BACK
    - assert: { var: BACK, equals: s3cr3t-value }
expect:
  status: succeeded
  outputs:
    SECRET: { $secret: true }
    FILE: { $regex: '^(/|[A-Za-z]:\\)\S' }
  nodes:
    /do/2: { status: succeeded }
notes: >-
  The assert compares the plan variable's value, which is never masked; it
  holds only if the file kept the secret as written. BACK isn't an output, so
  its masking (VA-51) doesn't matter here.
