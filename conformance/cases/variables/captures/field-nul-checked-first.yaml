title: A field capture applies the NUL check before parsing JSON
rules: [VA-21, VA-22]
features: [exec, capture-fields]
plan: |
  blokky: 1.0
  exec: [blokky-testkit, print, --out-hex, '226100220a']
  capture: { V: . }
expect:
  status: failed
  error: { code: BK_CAPTURE_NUL, node: / }
notes: The output is a JSON string with a raw U+0000 inside; the VA-21 checks run first (VA-22), so it is BK_CAPTURE_NUL, not BK_CAPTURE_JSON.
