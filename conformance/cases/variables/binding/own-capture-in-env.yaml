title: A node's env can't reference the node's own capture
rules: [VA-37, RF-6]
features: [exec, env, capture]
plan: |
  blokky: 1.0
  exec: [blokky-testkit, getenv, X]
  env: { X: { var: OUT } }
  capture: OUT
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-6 }
      line: 3
      column: 18
  exhaustive: true   # RF-6, RF-16 and RF-27 win over RF-23 (ADR 0025)
