title: Two sequential siblings can't capture the same name
rules: [VA-36, RF-26]
features: [do, exec, capture]
plan: |
  blokky: 1.0
  do:
    - exec: [blokky-testkit, print, --out, one]
      capture: A
    - exec: [blokky-testkit, print, --out, two]
      capture: A
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-26 }
      line: 6
      column: 14
