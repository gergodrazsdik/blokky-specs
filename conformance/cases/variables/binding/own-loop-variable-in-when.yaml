title: A node's when can't reference the for variable the node itself introduces
rules: [VA-37, RF-6]
features: [for-each, when, cond-var, log, interpolation]
plan: |
  blokky: 1.0
  for: { each: [a, b], as: ITEM }
  when: { var: ITEM, equals: a }
  log: "item ${ITEM}"
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-6 }
      line: 3
      column: 14
  exhaustive: true   # RF-6, RF-16 and RF-27 win over RF-23 (ADR 0025)
