title: ignore_errors on a leaf doesn't hide the cancellation of its enclosing group
rules: [EM-36]
spec: [reference.md§4.11]
features: [all, do, exec, ignore-errors]
plan: |
  blokky: 1.0
  all:
    - do:
        - ignore_errors: true
          exec: [blokky-testkit, sleep, 1m]
        - exec: [blokky-testkit, write-file, marker.txt, --text, reached]
    - exec: [blokky-testkit, print, --sleep, 3s, --exit, '3']
expect:
  status: failed
  error: { code: BK_EXIT, node: /all/1 }
  nodes:
    /all/0: { status: cancelled }
    /all/0/do/0:
      status: cancelled
      ignored: { $absent: true }
      error: { code: BK_CANCELLED, node: /all/0/do/0 }
    /all/0/do/1:
      status: skipped
      skip_reason: not_reached
  files:
    marker.txt: { exists: false }
notes: >-
  The failing sibling cancels the do (fail_fast). The leaf's ignore_errors
  covers its own failures only, so the do doesn't go on to its second child.
