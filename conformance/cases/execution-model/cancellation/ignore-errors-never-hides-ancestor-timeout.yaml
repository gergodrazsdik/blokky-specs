title: ignore_errors on a cancelled leaf doesn't hide an ancestor's timeout
rules: [EM-36]
spec: [reference.md§4.11]
features: [do, exec, timeout, ignore-errors]
plan: |
  blokky: 1.0
  timeout: 3s
  do:
    - ignore_errors: true
      exec: [blokky-testkit, sleep, 1m]
    - exec: [blokky-testkit, write-file, marker.txt, --text, reached]
expect:
  status: failed
  error: { code: BK_TIMEOUT_TOTAL, node: / }
  nodes:
    /: { status: timed_out }
    /do/0:
      status: cancelled
      ignored: { $absent: true }
      error: { code: BK_CANCELLED, node: /do/0 }
    /do/1:
      status: skipped
      skip_reason: not_reached
  files:
    marker.txt: { exists: false }
notes: >-
  If ignore_errors hid the cancellation, the do would go on to its second
  child. ignore_errors hid nothing, so the leaf has no ignored field
  (results.md §3).
