title: A service that exits before it is ready fails the node with BK_SERVICE_EXITED, and the body doesn't run
rules: [EM-63]
spec: [reference.md§4.9, errors.md§5.5, results.md§3]
features: [do, exec, services, finally]
clock: [real]
plan: |
  blokky: 1.0
  finally:
    - exec: [blokky-testkit, print, --out, cleanup]
  services:
    - name: started
      exec: [blokky-testkit, print, --out, ready, --hang]
      ready: { output: stdout, contains: ready }
    - name: crash
      exec: [blokky-testkit, print, --out, booting, --exit, '3']
      ready: { output: stdout, contains: ready }
  do:
    - exec: [blokky-testkit, print, --out, body]
expect:
  status: failed
  error:
    code: BK_SERVICE_EXITED
    node: /
    detail: { service: crash, exit_code: 3 }
  nodes:
    /:
      status: failed
      services:
        - { name: started, ended: stopped }
        - { name: crash, ended: exited, exit_code: 3 }
      finally_status: { $absent: true }
    /do/0: { status: skipped, skip_reason: not_reached }
    /finally/0: { status: skipped, skip_reason: not_reached }
  invocations:
    - { argv: [print, --out, ready, --hang] }
    - { argv: [print, --out, booting, --exit, '3'] }
notes: >-
  The second service exits with 3 before its ready text ever appears. The
  started service is stopped, and neither the body nor the finally runs: both
  are skipped with not_reached, and there is no finally status. The crashed
  service ended exited, with its code, although it was never ready.
