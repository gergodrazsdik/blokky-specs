title: A do with fail_fast false runs every child and fails with the first failure, the others attached as causes
rules: [EM-3, EM-52, EM-66]
spec: [reference.md§2.3]
features: [do, exec]
plan: |
  blokky: 1.0
  fail_fast: false
  do:
    - exec: [blokky-testkit, exit, '3']
    - exec: [blokky-testkit, exit, '0']
    - exec: [blokky-testkit, exit, '5']
expect:
  status: failed
  error:
    code: BK_EXIT
    node: /do/0
    detail: { exit_code: 3 }
    causes:
      - { code: BK_EXIT, node: /do/2, detail: { exit_code: 5 } }
  nodes:
    /: { status: failed }
    /do/0:
      status: failed
      exit_code: 3
      error: { code: BK_EXIT, node: /do/0, causes: { $one_of: [{ $absent: true }, []] } }   # attached causes belong to the group's error (EM-66)
    /do/1: { status: succeeded, exit_code: 0 }
    /do/2: { status: failed, exit_code: 5, error: { code: BK_EXIT, node: /do/2 } }
  invocations:
    - { argv: [exit, '3'] }
    - { argv: [exit, '0'] }
    - { argv: [exit, '5'] }
