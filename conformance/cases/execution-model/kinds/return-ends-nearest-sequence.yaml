title: return ends only its nearest enclosing do; the outer sequence goes on
rules: [EM-67]
spec: [reference.md§2.13]
features: [do, return, exec]
plan: |
  blokky: 1.0
  do:
    - do:
        - return: Inner block done
        - exec: [blokky-testkit, print, --out, inner]
    - exec: [blokky-testkit, print, --out, outer]
expect:
  status: succeeded
  error: null
  nodes:
    /do/0: { status: succeeded }
    /do/0/do/0: { status: succeeded }
    /do/0/do/1: { status: skipped, skip_reason: returned }
    /do/1: { status: succeeded }
  invocations:
    - { argv: [print, --out, outer] }
