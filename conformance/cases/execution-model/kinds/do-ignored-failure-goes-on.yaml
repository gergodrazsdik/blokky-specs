title: An ignored failure in a do doesn't stop it or fail it, and keeps its own status with ignored true
rules: [EM-45]
spec: [reference.md§4.11]
features: [do, exec, ignore-errors]
plan: |
  blokky: 1.0
  do:
    - exec: [blokky-testkit, exit, '3']
      ignore_errors: true
    - exec: [blokky-testkit, exit, '0']
expect:
  status: succeeded
  error: null
  nodes:
    /: { status: succeeded }
    /do/0:
      status: failed
      ignored: true
      exit_code: 3
      error: { code: BK_EXIT, node: /do/0, detail: { exit_code: 3 } }
    /do/1: { status: succeeded }
  invocations:
    - { argv: [exit, '3'] }
    - { argv: [exit, '0'] }
