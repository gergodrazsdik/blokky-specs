title: return ends its do; the remaining nodes are skipped as returned, and the do's finally still runs
rules: [EM-67]
spec: [reference.md§2.13]
features: [do, return, exec, finally]
plan: |
  blokky: 1.0
  finally:
    - exec: [blokky-testkit, print, --out, cleanup]
  do:
    - exec: [blokky-testkit, print, --out, before]
    - return: Nothing left to do
    - exec: [blokky-testkit, print, --out, after]
expect:
  status: succeeded
  error: null
  nodes:
    /: { status: succeeded, finally_status: succeeded }
    /do/0: { status: succeeded }
    /do/1:
      kind: return
      status: succeeded
      messages: [{ text: Nothing left to do, level: info }]
    /do/2: { status: skipped, skip_reason: returned }
    /finally/0: { status: succeeded }
  invocations:
    - { argv: [print, --out, before] }
    - { argv: [print, --out, cleanup] }
