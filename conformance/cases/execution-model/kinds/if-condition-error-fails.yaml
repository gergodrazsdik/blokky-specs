title: A condition error in if fails the node, and neither branch runs
rules: [CO-38]
spec: [reference.md§2.7]
features: [vars, if, exec, cond-var, cond-numeric]
plan: |
  blokky: 1.0
  vars:
    COUNT: many
  if: { var: COUNT, gt: '1' }
  then:
    - exec: [blokky-testkit, print, --out, then]
  else:
    - exec: [blokky-testkit, print, --out, else]
expect:
  status: failed
  error:
    code: BK_CONDITION_ERROR
    node: /
    detail: { reason: not_a_number }
  nodes:
    /: { status: failed }
  invocations: []
