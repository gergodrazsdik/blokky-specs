title: A race decided by a failure fails with that child's error and binds nothing
rules: [EM-58, EM-59]
spec: [reference.md§2.6]
features: [outputs, race, exec, capture]
plan: |
  blokky: 1.0
  outputs: [WINNER]
  race:
    - exec: [blokky-testkit, print, --out, lost, --exit, '3']
      capture: WINNER
expect:
  status: failed
  error: { code: BK_EXIT, node: /race/0, detail: { exit_code: 3 } }
  outputs:
    WINNER: null
  nodes:
    /: { status: failed, error: { code: BK_EXIT, node: /race/0 } }
    /race/0: { status: failed }
