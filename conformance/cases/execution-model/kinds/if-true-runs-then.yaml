title: An if with a true condition runs then, not else, and takes then's status
rules: [EM-48]
spec: [reference.md§2.7]
features: [vars, if, exec, cond-var]
plan: |
  blokky: 1.0
  vars:
    TARGET: prod
  if: { var: TARGET, equals: prod }
  then:
    - exec: [blokky-testkit, print, --out, then]
  else:
    - exec: [blokky-testkit, print, --out, else]
expect:
  status: succeeded
  error: null
  nodes:
    /: { kind: if, status: succeeded }
    /then/0: { status: succeeded }
    /else/0: { status: skipped, skip_reason: not_taken, duration: { $absent: true } }
  invocations:
    - { argv: [print, --out, then] }
