title: An if with a false condition and no else succeeds without running anything
rules: [EM-48]
spec: [reference.md§2.7]
features: [vars, if, exec, cond-var]
plan: |
  blokky: 1.0
  vars:
    TARGET: staging
  if: { var: TARGET, equals: prod }
  then:
    - exec: [blokky-testkit, exit, '3']
expect:
  status: succeeded
  error: null
  nodes:
    /: { kind: if, status: succeeded }
    /then/0: { status: skipped, skip_reason: not_taken }
  invocations: []
