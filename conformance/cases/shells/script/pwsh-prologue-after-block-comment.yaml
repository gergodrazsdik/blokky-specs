title: 'On the line that closes a block comment, the PowerShell prologue goes after the #>'
rules: [SH-17]
features: [outputs, script, shell-pwsh, ok-exit, capture]
requires:
  shells: [pwsh]
clock: [real]
plan: |
  blokky: 1.0
  outputs: [SEEN]
  shell: pwsh
  script: |
    <# conf: a block comment
        over two lines #> Write-Output before; Get-Item -LiteralPath ./conf-missing-file
    Write-Output after
  ok_exit: [1]
  capture: SEEN
expect:
  status: succeeded
  outputs:
    SEEN: before
  nodes:
    /:
      status: succeeded
      exit_code: 1
notes: >-
  The code after #> on line 2 is the first code of the script, so it already
  runs with $ErrorActionPreference = 'Stop': the Get-Item error ends the
  script with 1 and after is never written. A prologue placed on line 3
  would let the error through (exit 0, before and after); one placed at the
  start of line 2 would sit inside the comment.
