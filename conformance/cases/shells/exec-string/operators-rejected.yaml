title: Unquoted operator characters in an exec string (string form) are plan errors
rules: [SH-7]
features: [do, exec-string]
plan: |
  blokky: 1.0
  do:
    - exec: blokky-testkit argv a|b
    - exec: blokky-testkit argv a&b
    - exec: blokky-testkit argv a;b
    - exec: blokky-testkit argv a<b
    - exec: blokky-testkit argv a>b
    - exec: blokky-testkit argv (a
    - exec: blokky-testkit argv a)
expect:
  plan_errors:
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 3, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 4, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 5, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 6, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 7, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 8, column: 11 }
    - { code: BK_PLAN_VALUE, detail: { rule: SH-7 }, line: 9, column: 11 }
  exhaustive: true
notes: >-
  The string alone decides the error, so it is BK_PLAN_VALUE (errors.md §4),
  located at the value's start (SY-1).
