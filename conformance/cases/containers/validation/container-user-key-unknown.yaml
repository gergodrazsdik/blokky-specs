title: container has no user field
rules: [SY-19]
spec: [containers.md§2.1]
features: [container, exec]
plan: |
  blokky: 1.0
  container:
    image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    user: '1000'
  exec: [sh, -c, 'exit 0']
expect:
  plan_errors:
    - code: BK_PLAN_UNKNOWN_KEY
      line: 4
      column: 3
  exhaustive: true
notes: container.user was dropped (ADR 0017 D-2); the implementation maps the invoking user instead (CP-17).
