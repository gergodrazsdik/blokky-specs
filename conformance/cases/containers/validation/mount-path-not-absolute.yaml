title: A mount's container path must be absolute
rules: [CP-13]
features: [container, exec]
plan: |
  blokky: 1.0
  container:
    image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    mounts:
      - { host: ., path: src }
  exec: [sh, -c, 'exit 0']
expect:
  plan_errors:
    - code: BK_PLAN_VALUE   # the value's grammar alone decides it (errors.md §4)
      line: 5
      column: 24   # the value src (SY-1)
  exhaustive: true
