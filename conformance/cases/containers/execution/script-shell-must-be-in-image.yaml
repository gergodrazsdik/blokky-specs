title: A script's shell must be in the image, even when the host has it
rules: [CP-15]
spec: [errors.md§5.1]
features: [container, script, shell-bash]
requires:
  shells: [bash]
  container-engine: true
clock: [real]
plan: |
  blokky: 1.0
  container: { image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec }
  shell: bash
  script: |
    exit 0
expect:
  status: failed
  error: { code: BK_SHELL_UNAVAILABLE, node: / }
  nodes:
    /: { status: failed, error: { code: BK_SHELL_UNAVAILABLE, node: / } }
notes: >-
  The pinned busybox image has sh but no bash, so the named shell isn't in
  the image: BK_SHELL_UNAVAILABLE (CP-15, ADR 0026), although the host has
  bash.
