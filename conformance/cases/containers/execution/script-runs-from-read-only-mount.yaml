title: A script leaf runs the image's sh on the script file in the read-only scripts mount
rules: [CP-11, CP-15]
features: [outputs, container, script, shell-sh, capture]
requires:
  container-engine: true
clock: [real]
plan: |
  blokky: 1.0
  outputs: [SEEN]
  container: { image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec }
  shell: sh
  script: |
    if (: >> "$0") 2>/dev/null; then echo writable; else echo read-only; fi
    command -v blokky-testkit || echo no-testkit
  capture: SEEN
expect:
  status: succeeded
  outputs:
    SEEN: "read-only\nno-testkit"
notes: >-
  $0 is the script file (SH-13). Opening it for appending fails on a read-only
  mount whatever the user, and writes nothing if it succeeds; the subshell keeps
  a failed redirection from ending the script.
