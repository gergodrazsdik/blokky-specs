title: A container leaf's result records the container and the argv run inside it
rules: [CP-6, CP-38]
spec: [results.md§3.1]
features: [container, do, exec]
requires:
  container-engine: true
clock: [real]
plan: |
  blokky: 1.0
  container: { image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec }
  do:
    - exec: [sh, -c, 'exit 0']
    - exec: [sh, -c, 'exit 0']
expect:
  status: succeeded
  error: null
  nodes:
    /do/0:
      status: succeeded
      invocation: [sh, -c, 'exit 0']
      container:
        engine: { $present: true }
        image_digest: { $present: true }
        id: { $present: true }
        labelling_disabled: { $one_of: [true, false] }
    /do/1:
      status: succeeded
      invocation: [sh, -c, 'exit 0']
      container: { id: { $present: true } }
notes: >-
  The field holds the engine, the image digest, the container id and whether
  labelling was disabled (results.md §3.1, ADR 0026); which engine, which
  digest of the multi-arch image and the id's form are engine-defined. The
  invocation is the argv run inside the container, not the engine command
  (CP-38).
