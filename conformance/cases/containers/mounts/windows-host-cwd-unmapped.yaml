title: On Windows, an absolute host cwd outside every mount is unmapped, not a container path
rules: [CP-9, CP-14, CP-41]
spec: [errors.md§5.5]
features: [cwd, container, exec]
requires:
  os: [windows]
  container-engine: true
clock: [real]
plan: |
  blokky: 1.0
  cwd: 'C:\'
  container: { image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec }
  exec: [pwd]
expect:
  status: failed
  error: { code: BK_CWD_UNMAPPED, node: / }
  nodes:
    /: { status: failed, error: { code: BK_CWD_UNMAPPED, node: / } }
notes: >-
  C:\ is an absolute host path on Windows and exists, so the host check
  passes. It isn't under the default mount, the invocation cwd (CP-9), and as
  a drive-letter path it can't be a container path, which is POSIX on every
  host (CP-41), so it maps through no mount: BK_CWD_UNMAPPED (CP-14). On Linux
  and macOS the same plan with / would be a container path
  (empty-mounts-container-cwd).
