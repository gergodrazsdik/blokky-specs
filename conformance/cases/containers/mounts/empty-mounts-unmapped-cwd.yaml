title: mounts [] mounts only the runtime dirs, so the run's cwd is unmapped
rules: [CP-12, CP-14]
spec: [errors.md§5.5]
features: [container, exec]
requires:
  container-engine: true
clock: [real]
plan: |
  blokky: 1.0
  container:
    image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    mounts: []
  exec: [pwd]
expect:
  status: failed
  error: { code: BK_CWD_UNMAPPED, node: / }
  nodes:
    /: { status: failed }
