title: backoff never grows the delay beyond its max
spec: [reference.md§5.3]
features: [vars, assert, cond-var, retry-condition, cond-result, backoff]
clock: [virtual, scaled, real]
plan: |
  blokky: 1.0
  vars:
    X: a
  retry: { result: error, equals: BK_ASSERT }
  max: 4
  every: 1s
  backoff: { factor: 10, max: 2s }
  assert: { var: X, equals: b }
expect:
  status: failed
  error: { code: BK_RETRIES_EXHAUSTED, node: / }
  nodes:
    /:
      status: failed
      repetition: { count: 4, ended_by: max }
  duration: { $min: 5s, $max: 10s }
notes: Delays of 1s, then 10s and 100s capped at 2s each, 5s in total; uncapped they would total 111s.
