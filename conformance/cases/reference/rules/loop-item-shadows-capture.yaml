title: A loop variable can't shadow a capture of an enclosing scope
rules: [RF-7]
features: [do, exec, capture, for-each]
plan: |
  blokky: 1.0
  do:
    - exec: [blokky-testkit, print, --out, x]
      capture: ITEM
    - for: { each: [a, b], as: ITEM }
      exec: [blokky-testkit, argv, { var: ITEM }]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-7 }
      line: 5
