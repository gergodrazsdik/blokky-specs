title: The result subject isn't valid in a while condition
rules: [RF-13]
features: [while, cond-result, exec]
plan: |
  blokky: 1.0
  while: { result: exit, equals: '1' }
  max: 3
  exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-13 }
      line: 2
      column: 10   # the result subject key
notes: while is repetition too, but result is valid only in until and retry conditions.
