title: A vars template can't use a later vars entry
rules: [RF-27]
features: [vars, log, interpolation]
plan: |
  blokky: 1.0
  vars:
    URL: https://${HOST}/healthz
    HOST: example.com
  log: "${URL}"
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-27 }
      line: 3
      column: 8    # the value; an error inside a string is at its start (SY-1)
notes: vars values use only inputs, earlier vars entries and from_env.
