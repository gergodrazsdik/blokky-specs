title: A literal marked secret is a plan error under RF-19, not an unknown key
rules: [RF-19]
features: [env, exec]
plan: |
  blokky: 1.0
  env: { TOKEN: { value: abc123, secret: true } }
  exec: [blokky-testkit, env, TOKEN]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-19 }
      line: 2
  exhaustive: true
notes: >-
  The targeted error replaces the generic unknown-key error (SY-91, ADR 0021
  B-3). No column: the spec doesn't say whether value, secret or the mapping
  is the offending token.
