title: A ${…} in an exec argument, a literal field, is a plan error
rules: [RF-9]
features: [vars, exec]
plan: |
  blokky: 1.0
  vars: { NAME: demo }
  exec: [blokky-testkit, argv, '--name=${NAME}']
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-9 }
      line: 3
      column: 30   # the opening quote of the element (SY-1)
notes: RF-9 wins over RF-27 for ${…} in a literal field (errors.md §4).
