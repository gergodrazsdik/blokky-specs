title: A template in an exec argument is a plan error
rules: [RF-27]
features: [vars, exec]
plan: |
  blokky: 1.0
  vars: { NAME: demo }
  exec: [blokky-testkit, argv, '--name=${NAME}']
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-27 }
      line: 3
      column: 30   # the element, the value that is wrong
