title: An input with both in and matches is a plan error
rules: [RF-20]
features: [inputs, log, interpolation]
plan: |
  blokky: 1.0
  inputs:
    MODE:
      in: [fast, slow]
      matches: '^[a-z]+$'
  log: "Mode ${MODE}"
inputs: [MODE=fast]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-20 }
      line: 5      # matches, the later key (SY-1)
      column: 5
notes: The input is supplied so no input error is expected.
