title: A capture under finally can't be used after the node
rules: [RF-16]
features: [do, exec, finally, capture, log, interpolation]
plan: |
  blokky: 1.0
  do:
    - exec: [blokky-testkit, exit, '0']
      finally:
        - exec: [blokky-testkit, print, --out, cleaned]
          capture: CLEAN
    - log: "cleanup: ${CLEAN}"
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-16 }
      line: 7
notes: The scope check (RF-23) may report the same reference too, so the case isn't exhaustive.
