title: A name bound only in then can't be used in else
rules: [RF-23]
features: [vars, if, cond-var, set, log, interpolation]
plan: |
  blokky: 1.0
  vars: { FLAG: 'no' }
  if: { var: FLAG, equals: 'yes' }
  then:
    - set: { MODE: a }
  else:
    - log: "mode ${MODE}"
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-23 }
      line: 7
notes: No binding of MODE can come before the else branch (VA-38, "a name bound only in an unrelated branch").
