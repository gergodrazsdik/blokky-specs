title: A return inside a do child of an all ends that do
rules: [RF-29]
spec: [reference.md§2.13]
features: [all, do, return, exec]
plan: |
  blokky: 1.0
  all:
    - do:
        - return: done early
        - exec: [blokky-testkit, exit, '1']
    - exec: [blokky-testkit, exit, '0']
expect:
