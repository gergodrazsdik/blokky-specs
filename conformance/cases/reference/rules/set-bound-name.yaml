title: A set of a name that is already bound is a plan error
rules: [RF-26]
features: [do, exec, capture, set]
plan: |
  blokky: 1.0
  do:
    - exec: [blokky-testkit, print, --out, a]
      capture: MODE
    - set: { MODE: b }
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-26 }
      line: 5
      column: 12   # the set key MODE
