title: An absolute cwd together with tempdir is a plan error (Unix path)
rules: [RF-11]
features: [tempdir, cwd, exec]
requires:
  os: [linux, macos]
plan: |
  blokky: 1.0
  tempdir: true
  cwd: /tmp
  exec: [blokky-testkit, exit, '0']
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-11 }
      line: 3      # cwd, the later of the two keys (SY-1)
      column: 1
notes: >-
  The Windows twin is
  tempdir-absolute-cwd-windows; plans can't be overridden per OS (CF-34).
