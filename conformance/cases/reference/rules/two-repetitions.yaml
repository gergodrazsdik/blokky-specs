title: A node with two repetition modifiers is a plan error
rules: [RF-2]
features: [retry, for-each, exec]
plan: |
  blokky: 1.0
  for: { each: [a, b], as: ITEM }
  retry: true
  exec: [blokky-testkit, argv, { var: ITEM }]
expect:
  plan_errors:
    - code: BK_PLAN_INVALID
      detail: { rule: RF-2 }
notes: >-
  No position: either repetition key could be the offending one. No max or
  every either, so no sibling-table error (RF-3) can fire as well.
